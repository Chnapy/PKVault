name: Static content

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Convert View
        run: |
          docker build . --target convert-view-builder -t tmp-convert
          docker create --name tmp-convert tmp-convert

          docker cp tmp-convert:/app/publish _export

          docker rm tmp-convert
          docker rmi tmp-convert

          ls -la _export

  build-deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Convert View
        run: |
          docker build . --target convert-view-builder -t tmp-convert
          docker create --name tmp-convert tmp-convert

          docker cp tmp-convert:/app/publish _export

          docker rm tmp-convert
          docker rmi tmp-convert

          ls -la _export

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _export

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
