name: Static content

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Convert View
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SIXLABORS_LICENSE_KEY:-}" ]; then
            echo "::error::SIXLABORS_LICENSE_KEY is not configured."
            exit 1
          fi

          container_id=""
          cleanup() {
            if [ -n "${container_id}" ]; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
            fi
            docker rmi tmp-convert >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --target convert-view-builder \
            --build-arg SIXLABORS_LICENSE_KEY="${SIXLABORS_LICENSE_KEY}" \
            -t tmp-convert \
            .

          container_id=$(docker create tmp-convert)
          mkdir -p _export
          docker cp "${container_id}:/app/publish/." _export/

          echo "Exported site files:"
          ls -la _export

          if [ -z "$(find _export -type f -print -quit)" ]; then
            echo "::error::The Docker build exported no site files."
            exit 1
          fi

  build-deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'Chnapy/PKVault'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Convert View
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SIXLABORS_LICENSE_KEY:-}" ]; then
            echo "::error::SIXLABORS_LICENSE_KEY is not configured."
            exit 1
          fi

          container_id=""
          cleanup() {
            if [ -n "${container_id}" ]; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
            fi
            docker rmi tmp-convert >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --target convert-view-builder \
            --build-arg SIXLABORS_LICENSE_KEY="${SIXLABORS_LICENSE_KEY}" \
            -t tmp-convert \
            .

          container_id=$(docker create tmp-convert)
          mkdir -p _export
          docker cp "${container_id}:/app/publish/." _export/

          echo "Exported site files:"
          ls -la _export

          if [ -z "$(find _export -type f -print -quit)" ]; then
            echo "::error::The Docker build exported no site files."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _export

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
