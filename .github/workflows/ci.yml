name: Build PKVault Desktop

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build PKVault Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore PKVault.Desktop/PKVault.Desktop.csproj

      - name: Build Release configuration
        run: >
          dotnet build PKVault.Desktop/PKVault.Desktop.csproj
          --configuration Release
          --no-restore

      - name: Publish self-contained Windows application
        run: >
          dotnet publish PKVault.Desktop/PKVault.Desktop.csproj
          --configuration Release
          --no-build
          --runtime win-x64
          --self-contained true
          --output ./artifact/PKVault

      - name: Display published files
        shell: pwsh
        run: |
          Get-ChildItem -Path "./artifact/PKVault" -Recurse -File |
            Select-Object FullName, Length

      - name: Upload PKVault desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-Windows-x64-${{ github.sha }}
          path: ./artifact/PKVault
          if-no-files-found: error
          retention-days: 30
